name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            features: "--no-default-features"
          - os: macos-latest
            features: "--features metal"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - if: runner.os == 'macOS'
        run: python3 scripts/check-localizations.py
      - run: cargo test --locked ${{ matrix.features }}
      - run: cargo build --locked ${{ matrix.features }}
      - run: python3 eval/verify_hybrid.py --binary target/debug/weft
      - run: python3 eval/verify_bootstrap.py
