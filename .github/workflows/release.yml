name: Release binaries
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            features: --features metal
            asset: macos-aarch64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: --no-default-features
            asset: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Package binary
        env:
          ASSET: ${{ matrix.asset }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -czf "dist/weft-${TAG}-${ASSET}.tar.gz" -C "target/${TARGET}/release" weft
      - uses: actions/upload-artifact@v4
        with:
          name: weft-${{ matrix.asset }}
          path: dist/*.tar.gz
          if-no-files-found: error
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: arm64
          - os: macos-15-intel
            asset: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build signed desktop app and installer
        env:
          WEFT_APP_VERSION: ${{ github.ref_name }}
        run: scripts/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: weft-desktop-${{ matrix.asset }}
          path: |
            dist/Weft-*.dmg
            dist/Weft-*.zip
          if-no-files-found: error
  publish:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: sha256sum dist/*.tar.gz dist/*.zip dist/*.dmg > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
