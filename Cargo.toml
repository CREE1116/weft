[package]
name = "myvec"
version = "0.6.0"
edition = "2024"
description = "Local file explorer for agents powered by EmbeddingGemma 2"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
ahash = "0.8.12"
anyhow = "1"
blake3 = "1"
candle-core = { version = "0.11.0" }
candle-nn = { version = "0.11.0" }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
ignore = "0.4"
pdf-extract = "0.12.1"
lopdf = { version = "0.42", default-features = false }
png = "0.18"
quick-xml = "0.38"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21.4", default-features = false, features = ["fancy-regex"] }
ureq = { version = "2", features = ["json"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
