[package]
name = "weft"
version = "1.0.2"
edition = "2024"
description = "Local-first semantic file search for macOS and AI agents"
build = "build.rs"

[features]
default = ["metal"]
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
ahash = "0.8.12"
anyhow = "1"
blake3 = "1"
memmap2 = "0.9"
notify = "8"
candle-core = { version = "0.11.0" }
candle-nn = { version = "0.11.0" }
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
fs2 = "0.4"
half = "2"
ignore = "0.4"
pdf-extract = "0.12.1"
lopdf = { version = "0.42", default-features = false }
png = "0.18"
quick-xml = "0.38"
rusqlite = { version = "0.40", features = ["bundled"] }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21.4", default-features = false, features = ["fancy-regex"] }
ureq = { version = "2", features = ["json"] }
unicode-normalization = "0.1"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
